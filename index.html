    body {

  margin: 20px;
}

main {
  justify-content: center;
  align-items: center;
}

.container {
  display: flex;
  flex-direction: row;
  justify-content: space-evenly;
  align-items: center;
}

h1 {
  text-align: center;
  color: #ffd700;
  text-shadow: 1px 1px 2px #000;
}

p {
  color: rgb(0, 255, 0); /* lichtere goudtint voor leesbaarheid */
  max-width: 800px;
  margin: 0 auto 20px auto;
  line-height: 1.5;
  text-align: center;
}

button {
  display: block;
  margin: 20px auto;
  padding: 10px 20px;
  background-color: #ffd700;
  color: #1a1a1a;
  border: 2px solid #daa520;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s ease;
}

button:hover {
  background-color: #daa520;
  color: #fff;
}

/* Rijen */
div.row {
  display: flex;
  flex-direction: row;
  margin-bottom: 10px;
  justify-content: center;
}

/* Visible & Hidden containers */
div.visible, div.hidden {
  display: flex;
  flex-direction: row;
  gap: 5px; /* ruimte tussen blokken */
}

/* Ruimte tussen blokken */
div.space {
  width: 20px;
}

/* Tabellen (blokken) */
div.table {
  border: 2px solid #ffd700;
  background-color: #1a1a1a;
  color: #ffd700;
  padding: 5px;
  margin: 2px;
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 1.2em;
  transition: all 0.2s ease;
}

div.table:hover {
  background-color: #daa520;
  color: #1a1a1a;
  transform: scale(1.1);
}

.allTables {
  display: flex;
  flex-direction: column;
}

.winscreen {

  </style>

  <script>
   console.log('Kien');

    let winners = JSON.parse(localStorage.getItem('winners')) || [];
    winners = winners.filter(w => typeof w === 'string');
    localStorage.setItem('winners', JSON.stringify(winners));

    function getTableDivs() {
      return Array.from(document.querySelectorAll('.table')).filter(div => div.closest('.visible'));
    }

    function numberVisibleTables() {
      const tableDivs = getTableDivs();
      let number = 1;
      tableDivs.forEach(div => {
        div.textContent = number;
        div.id = `visible-${number}`;
        number++;
      });
    }

    function highlightPreviousWinners() {
      const tableDivs = getTableDivs();
      tableDivs.forEach(div => {
        div.style.backgroundColor = '#1a1a1a';
        div.style.color = '#2b2b3';
      });
      winners.forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          element.style.backgroundColor = 'green';
          element.style.color = '#fff';
        }
      });
    }

    function resetColor() {
      const tableDivs = getTableDivs();
      tableDivs.forEach(div => {
        if (!winners.includes(div.id)) {
          div.style.backgroundColor = '#1a1a1a';
          div.style.color = '#ffd700';
        }
      });
    }

    function chooseRandomTable() {
      const tableDivs = getTableDivs();
      if (tableDivs.length === 0) return null;
      const randomIndex = Math.floor(Math.random() * tableDivs.length);
      return tableDivs[randomIndex];
    }

    function randomDivColor() {
      const randomDiv = chooseRandomTable();
      if (!randomDiv) return;
      randomDiv.style.backgroundColor = 'green';
      randomDiv.style.color = '#fff';
    }

    function addWinnerById(id) {
      if (typeof id !== 'string') return false;
      if (!winners.includes(id)) {
        winners.push(id);
        localStorage.setItem('winners', JSON.stringify(winners));
        return true;
      }
      return false;
    }

    function playAnimation() {
      document.getElementById("winscreenDiv").textContent = '';
      const tableDivs = getTableDivs();
      if (tableDivs.length === 0) {
        console.warn('No visible tables found.');
        return;
      }

      const iterations = Math.floor(Math.random() * 11) + 20;
      let count = 0;

      const interval = setInterval(() => {
        resetColor();
        randomDivColor();
        count++;

        if (count >= iterations) {
          clearInterval(interval);
          resetColor();

          const newWinner = chooseRandomTable();
          if (!newWinner) return;

          newWinner.style.backgroundColor = 'green';
          newWinner.style.color = '#fff';

          const added = addWinnerById(newWinner.id);
          if (added) {
            console.log('New winner added:', newWinner.id);
          } else {
            console.log('Winner already exists:', newWinner.id);
          }

          console.log('All winners:', winners);
          highlightPreviousWinners();
          winscreen();
        }
      }, 200);
    }

    function clearWinners() {
      winners = [];
      localStorage.removeItem('winners');
      resetColor();
      console.log('Winners cleared.');
    }

    function showWinners() {
      console.log('Winners (localStorage):', winners);
    }

    document.addEventListener('DOMContentLoaded', () => {
      numberVisibleTables();
      highlightPreviousWinners();
      window.playAnimation = playAnimation;
      window.clearWinners = clearWinners;
      window.showWinners = showWinners;
      window.getWinners = () => [...winners];
    });

    function winscreen() {
  const winscreenDiv = document.getElementById("winscreenDiv");
  const lastWinnerId = winners[winners.length - 1];
  const lastWinnerDiv = document.getElementById(lastWinnerId);
  const number = lastWinnerDiv ? lastWinnerDiv.textContent : '?';
  winscreenDiv.textContent = `Gefeliciteerd tafel ${number}!`;
}
